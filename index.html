<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aporte solidario DNCT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#3b0052;--bg2:#2a003b;--pink:#ff0a5c;--yel:#ffc000;--teal:#00a396;--pur:#7f3f98;--cream:#fff3d6}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:radial-gradient(circle at 50% 0,#55106f 0,var(--bg) 45%,var(--bg2) 100%);color:#fff;font-family:Poppins,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;overflow-x:hidden}
.logo{width:min(560px,92vw);height:auto}
h1{font-size:clamp(1rem,2.6vw,1.3rem);font-weight:500;color:var(--cream);text-align:center;margin:6px 0 18px;max-width:34ch}
.main{display:grid;grid-template-columns:1fr 1fr;gap:28px;width:min(980px,100%);align-items:center}
@media(max-width:760px){.main{grid-template-columns:1fr}}
.panel{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);border-radius:28px;padding:26px 22px;text-align:center}
.ringwrap{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:0 auto}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.track{stroke:rgba(255,255,255,.14)}
.bar{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px rgba(255,10,92,.7))}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pct{font-size:clamp(3.6rem,15vw,5.6rem);font-weight:800;line-height:1;color:var(--yel);animation:beat 1.6s ease-in-out infinite,hue 9s ease-in-out infinite;text-shadow:0 0 22px currentColor}
.pct small{font-size:.45em;color:var(--cream)}
.lbl{font-size:.85rem;color:var(--cream);margin-top:4px}
.money{margin-top:16px;font-size:clamp(1.5rem,5vw,2rem);font-weight:800}
.money span{color:var(--teal);filter:brightness(1.4)}
.sub{color:var(--cream);font-size:.95rem;margin-top:2px}
.bigmsg{font-size:clamp(1.15rem,3.4vw,1.5rem);font-weight:700;color:var(--yel);margin-bottom:16px;min-height:1.6em}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.box{background:var(--bg2);border-radius:18px;padding:14px 4px;border-bottom:4px solid var(--pink)}
.box:nth-child(2){border-color:var(--yel)}.box:nth-child(3){border-color:var(--teal)}.box:nth-child(4){border-color:var(--pur)}
.box b{display:block;font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;font-variant-numeric:tabular-nums}
.box i{font-style:normal;font-size:.75rem;color:var(--cream)}
.dl{margin-top:14px;font-size:.85rem;color:var(--cream)}
.people{margin-top:14px;font-size:.95rem;color:var(--cream)}
.people b{color:var(--yel);font-size:1.15rem}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes hue{0%,100%{color:#ffc000}25%{color:#ff3d7f}50%{color:#2de0cf}75%{color:#c98bf0}}
.btn{margin-top:18px;background:linear-gradient(135deg,var(--pink),#ff5c8a);color:#fff;border:0;border-radius:999px;padding:12px 26px;font:700 .95rem Poppins,system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(255,10,92,.4);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 10px 24px rgba(255,10,92,.55)}
.btn:active{transform:scale(.97)}.btn.go span{display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}.spin{display:none;transform-box:fill-box;transform-origin:center;animation:sp 1.1s linear infinite}.loading .spin{display:block}.loading .bar{opacity:0}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:#fff;color:var(--bg);font-weight:700;padding:10px 20px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:opacity .6s,transform .6s;pointer-events:none;white-space:nowrap;font-size:.95rem}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast em{font-style:normal;color:var(--pink)}
#cv{position:fixed;inset:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){.bar,#toast{transition:none}.pct{animation:none}.btn.go span{animation:none}}
</style>
</head>

<script>
/* ====== CONFIGURACIÓN: edita solo esta parte ====== */
const CONFIG = {
  titulo: "Aporte solidario DNCT",
  personas: 19,
  cuota: 10,                              // USD por persona
  limite: "2026-11-16T17:00:00-05:00",    // lunes 16 nov, 12:00 (hora de Ecuador)
  sheetCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR0qZVSdfNARgvSOSfZOCq4-laF1moGmlwZsjzLzZ54Xehd8_Xox6dy0jbCbyJaqGiOAlgxK5TPHINH/pub?output=csv",
  sheetId: "",   // respaldo si el CSV falla
  modo: "valores",                        // el total es la suma de la columna L
  colNombre: 1, colPago: 12, colValor: 11, // B = Nombre, M = Medio de pago (si tiene dato, ya pagó), L = Valor aportación
  refrescarSeg: 30
};
/* ================================================= */
const META = CONFIG.personas * CONFIG.cuota, C = 2*Math.PI*92;
const $ = id => document.getElementById(id);
$("title").textContent = CONFIG.titulo;
$("goal").textContent = "$" + META; $("pgoal").textContent = CONFIG.personas;
$("dl").textContent = "Fecha límite: " + new Date(CONFIG.limite).toLocaleString("es-EC",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"America/Guayaquil"});
let names = [], shown = 0, celebrated = false;

function parseCSV(t){
  const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){ if(ch=='"'){ if(t[i+1]=='"'){c+='"';i++} else q=false } else c+=ch }
    else if(ch=='"') q=true;
    else if(ch==','||ch==';'){r.push(c);c=""}
    else if(ch=='\n'){r.push(c);rows.push(r);r=[];c=""}
    else if(ch!='\r') c+=ch;
  }
  if(c||r.length){r.push(c);rows.push(r)}
  return rows;
}
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.,-]/g,"").replace(",",".")); return isNaN(n)?0:n };

async function getRows(){
  const u=CONFIG.sheetCsvUrl, errs=[];
  for(const url of [u, u+(u.includes("?")?"&":"?")+"t="+Date.now()]){
    try{ const r=await fetch(url,{cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status); return parseCSV(await r.text()); }
    catch(e){ errs.push("CSV: "+e.message); }
  }
  if(CONFIG.sheetId){ try{ return await viaScript(); }catch(e){ errs.push("Respaldo: "+e.message); } }
  throw new Error(errs.join(" | "));
}
function viaScript(){ return new Promise((ok,no)=>{
  const cb="gv"+Date.now(), sc=document.createElement("script");
  const done=()=>{ delete window[cb]; sc.remove(); };
  window[cb]=d=>{ done();
    if(d.status!=="ok") return no(new Error((d.errors&&d.errors[0]&&d.errors[0].message)||d.status));
    ok([[],...d.table.rows.map(r=>r.c.map(c=>c?(typeof c.v==="number"?String(c.v):(c.f!=null?c.f:(c.v!=null?c.v:""))):""))]); };
  sc.onerror=()=>{ done(); no(new Error("no se pudo cargar")); };
  sc.src="https://docs.google.com/spreadsheets/d/"+CONFIG.sheetId+"/gviz/tq?tqx=out:json;responseHandler:"+cb+"&sheet=Hoja1&headers=1";
  document.head.appendChild(sc); setTimeout(()=>no(new Error("tiempo agotado")),12000);
}); }
const DEMO=["Javier Lema","Doris Gonzales","María Torres","Carlos Vera","Ana Pérez","Luis Mora","Rosa Aguirre","Pedro Salas"];
const t0p=performance.now(); let first=true;
const titleCase=s=>s.toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
async function load(){
  let rows;
  if(!CONFIG.sheetCsvUrl){
    rows=[["Nombre","Valor"],...Array.from({length:34},(_,i)=>[DEMO[i%8],10])];
  } else { rows=await getRows(); }
  const hd=(rows[0]||[]).map(x=>String(x).toLowerCase());
  const fi=(re,d)=>{const i=hd.findIndex(h=>re.test(h));return i>=0?i:d};
  const cN=fi(/nombre/,CONFIG.colNombre), cV=fi(/valor|aportaci/,CONFIG.colValor), cP=fi(/medio|pago/,hd.length>13?CONFIG.colPago:cN);
  let cnt=0,val=0,list=[];
  rows.slice(1).forEach(r=>{
    const nm=(r[cN]||"").trim(), pago=(r[cP]||"").trim();
    if(!nm||!pago) return;
    cnt++; list.push(titleCase(nm)); val+=num(r[cV]);
  });
  $("err").textContent=""; names=list; render(CONFIG.modo==="valores"?val:cnt*CONFIG.cuota, cnt);
}
function animateNum(el,to,dur,pre=""){
  const from=parseFloat(el.dataset.v||0); if(from===to) return;
  el.dataset.v=to; const tok=el._tok=(el._tok||0)+1, t0=performance.now();
  (function f(t){ if(el._tok!==tok) return;
    const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3),v=from+(to-from)*e;
    el.textContent=pre+(Number.isInteger(to)?Math.round(v):v.toFixed(2)); if(k<1)requestAnimationFrame(f) })(t0);
}
function render(total,count){
  const frac=Math.min(1,total/META), go=()=>{
    const d=first?2400:1000; $("ring").classList.remove("loading"); $("lbl").textContent="de la meta";
    $("bar").style.transitionDuration=d+"ms"; $("bar").style.strokeDashoffset=C*(1-frac);
    animateNum($("pct"),Math.round(total/META*100),d); animateNum($("raised"),total,d,"$"); animateNum($("ppl"),count,d);
    if(total>=META&&!celebrated){celebrated=true;setTimeout(confetti,first?d:0)}
    first=false;
  };
  first ? setTimeout(go,Math.max(0,1800-(performance.now()-t0p))) : go();
}
function tick(){
  const ms = new Date(CONFIG.limite) - Date.now();
  if(ms<=0){ ["d","h","m","s"].forEach(i=>$(i).textContent="0"); $("msg").textContent="El plazo ha terminado. ¡Gracias por tu aporte!"; return }
  const s=Math.floor(ms/1000), d=Math.floor(s/86400);
  $("d").textContent=d; $("h").textContent=String(Math.floor(s%86400/3600)).padStart(2,"0");
  $("m").textContent=String(Math.floor(s%3600/60)).padStart(2,"0"); $("s").textContent=String(s%60).padStart(2,"0");
  $("msg").textContent = "Faltan";
}
let lastN="";
function toast(){
  if(!names.length) return;
  const pool=names.length>1?names.filter(x=>x!==lastN):names, n=pool[Math.floor(Math.random()*pool.length)], t=$("toast"); lastN=n;
  t.innerHTML = `💖 <em>${n.replace(/[<>&]/g,"")}</em> ya aportó`;
  t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),3200);
}
function confetti(){
  const cv=$("cv"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#ff0a5c","#ffc000","#00a396","#7f3f98","#fff3d6"];
  const ps=Array.from({length:160},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height,v:2+Math.random()*4,s:5+Math.random()*7,c:cols[Math.floor(Math.random()*5)]}));
  let f=0;(function a(){x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.y+=p.v;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s*.6)});if(++f<400)requestAnimationFrame(a);else x.clearRect(0,0,cv.width,cv.height)})();
}
